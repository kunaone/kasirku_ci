version: '3.7'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kasirku_app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - ci_network

  webserver:
    image: nginx:alpine
    container_name: codeigniter_webserver
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8000:80"
    networks:
      - ci_network
    depends_on:
      - app

  db:
    image: mysql:5.7
    container_name: kasirku_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mykasir
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - ci_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: codeigniter_phpmyadmin
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - ci_network

networks:
  ci_network:

volumes:
  db_data: